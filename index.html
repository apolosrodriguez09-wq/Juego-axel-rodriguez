<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Juego Axel Rodriguez</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola pantalla tipo consola, panel central con marco crema como las fichas de personaje; tema oscuro único a propósito */
:root{
  --night:#121830; --grid:#1c2645; --panel:#0e1222; --panel-2:#171d33;
  --cream:#F2E8D5; --cream-dim:#B9B1A2; --gold:#F2C14E; --good:#5BD17A; --bad:#EF6461;
  --display:"Silkscreen","Courier New",monospace;
  --body:"Pixelify Sans",ui-rounded,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{
  background:var(--night);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.4;
}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
.frame{background:var(--panel);border:4px solid var(--cream);border-radius:14px;box-shadow:0 0 0 4px var(--panel),0 10px 0 rgba(0,0,0,.35)}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
.logo{display:flex;align-items:center;gap:14px;padding:14px 20px}
.logo h1{font-size:clamp(22px,5vw,38px)}
.logo .tri{width:0;height:0;border-left:14px solid var(--cream);border-top:10px solid transparent;border-bottom:10px solid transparent}
.logo p{margin:0 0 0 auto;color:var(--cream-dim);font-size:15px;text-align:right}
.label{font-family:var(--display);font-size:13px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,.cell:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn{background:var(--panel-2);border:3px solid var(--cream);border-radius:10px;padding:10px 18px;font-family:var(--display);font-size:15px;box-shadow:0 4px 0 #000;transition:transform .08s}
.btn:hover{background:#222a48}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.primary{background:var(--gold);color:#1a1405;border-color:var(--cream)}
.btn.primary:hover{background:#ffd36a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:var(--cream-dim);color:var(--cream-dim);box-shadow:none}

/* selección de personaje */
.section{padding:20px;display:flex;flex-direction:column;gap:16px}
.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.char{background:var(--panel-2);border:3px solid #39415f;border-radius:12px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:border-color .15s,transform .15s}
.char:hover{border-color:var(--cream-dim);transform:translateY(-3px)}
.char[aria-pressed="true"]{border-color:var(--gold);background:#1f2440}
.char img{height:190px;width:auto;image-rendering:pixelated;filter:drop-shadow(0 6px 0 rgba(0,0,0,.4))}
.char[aria-pressed="true"] img{animation:bob 1s steps(2) infinite}
.char h3{font-size:20px}
.char .sub{color:var(--cream-dim);font-size:14px}
.char .perk{font-size:14px;border-top:2px solid #39415f;padding-top:8px;width:100%}
.char .perk b{color:var(--gold);font-weight:600}
.char .best{font-family:var(--display);font-size:11px;color:var(--cream-dim)}
@keyframes bob{50%{transform:translateY(-4px)}}

.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mode{background:var(--panel-2);border:3px solid #39415f;border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.mode:hover{border-color:var(--cream-dim)}
.mode[aria-pressed="true"]{border-color:var(--gold)}
.mode h3{font-size:15px}
.mode p{margin:0;color:var(--cream-dim);font-size:14px}
.mode .ico{height:34px;display:flex;gap:4px;align-items:center}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}

/* juego */
.hud{display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}
.hud .who{display:flex;align-items:center;gap:10px;min-width:0}
.hud .who img{height:56px;image-rendering:pixelated}
.hud .who b{font-family:var(--display);font-size:16px;display:block}
.hud .who span{font-size:13px;color:var(--cream-dim)}
.stats{display:flex;gap:18px;margin-left:auto;align-items:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:flex-start}
.stat .v{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.hearts{display:flex;gap:4px}
.hearts svg{width:22px;height:20px}
.stage{padding:20px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden;min-height:430px}
.prompt{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.prompt h2{font-size:clamp(16px,3.4vw,22px)}
.seq{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;background:#0a0d19;border-radius:10px;border:2px dashed #39415f}
.tile{width:66px;height:66px;background:var(--panel-2);border:3px solid #39415f;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.tile svg{width:46px;height:46px}
.tile.q{border:3px dashed var(--gold);color:var(--gold);animation:pulse 1.2s ease-in-out infinite}
.tile.q.done{animation:none;border-style:solid}
@keyframes pulse{50%{background:#2a2a1c}}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:560px;margin:0 auto;width:100%}
.opt{height:86px;background:var(--panel-2);border:3px solid var(--cream);border-radius:12px;display:grid;place-items:center;box-shadow:0 4px 0 #000;font-family:var(--display);font-size:24px}
.opt svg{width:52px;height:52px}
.opt:hover:not(:disabled){background:#222a48;transform:translateY(-2px)}
.opt.right{border-color:var(--good);background:#16321f}
.opt.wrong{border-color:var(--bad);background:#3a1717}
.opt.gone{opacity:.15}
.opt:disabled{cursor:default}
.gridwrap{display:flex;justify-content:center}
.grid{display:grid;gap:6px;padding:10px;background:#0a0d19;border-radius:10px;position:relative}
.cell{width:var(--cs,56px);height:var(--cs,56px);border-radius:8px;border:3px solid #39415f;background:var(--panel-2);padding:0}
.cell.on{background:var(--c,var(--gold));border-color:var(--cream)}
.cell.lock{cursor:default}
.cell.miss{border-color:var(--bad);box-shadow:inset 0 0 0 4px var(--bad)}
.cell.extra{border-color:var(--bad);background:#5a2020}
.cell.hint{border-color:var(--good)}
.axis{position:absolute;top:4px;bottom:4px;width:4px;background:var(--gold);left:calc(50% - 2px);border-radius:2px;pointer-events:none}
.timer{height:10px;background:#0a0d19;border-radius:5px;overflow:hidden;border:2px solid #39415f}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.footer{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.bubble{flex:1;min-width:0;background:var(--cream);color:#1a1405;border-radius:10px;padding:10px 14px;font-size:16px;position:relative;font-weight:500}
.bubble:before{content:"";position:absolute;left:-10px;bottom:14px;border-right:12px solid var(--cream);border-top:8px solid transparent;border-bottom:8px solid transparent}
.runner{position:absolute;bottom:8px;left:-140px;height:96px;image-rendering:pixelated;pointer-events:none;z-index:3}
.runner.go{animation:run 1.1s linear forwards}
@keyframes run{to{left:calc(100% + 40px)}}
.flash{position:absolute;inset:0;pointer-events:none;border-radius:10px}
.flash.good{animation:fg .5s}
.flash.bad{animation:fb .5s}
@keyframes fg{0%{box-shadow:inset 0 0 0 6px var(--good)}100%{box-shadow:inset 0 0 0 0 transparent}}
@keyframes fb{0%{box-shadow:inset 0 0 0 6px var(--bad)}100%{box-shadow:inset 0 0 0 0 transparent}}
.toast{font-family:var(--display);font-size:15px;min-height:22px}
.toast.good{color:var(--good)} .toast.bad{color:var(--bad)}

.over{padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.over img{height:200px;image-rendering:pixelated}
.over h2{font-size:clamp(22px,5vw,32px)}
.over .big{font-family:var(--display);font-size:44px;color:var(--gold);font-variant-numeric:tabular-nums}
.over p{margin:0;color:var(--cream-dim);max-width:46ch}
.how{color:var(--cream-dim);font-size:14px;margin:0}

@media (max-width:760px){
  .modes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .logo p{display:none}
}
@media (max-width:560px){
  .wrap{padding-block:12px 24px;gap:14px}
  .section{padding:16px}
  .logo{padding:12px 14px;gap:10px}
  .logo .tri{border-left-width:10px;border-top-width:8px;border-bottom-width:8px}
  .logo h1{font-size:clamp(18px,5vw,25px)}
  .chars{grid-template-columns:1fr}
  .char{flex-direction:row;text-align:left;align-items:center;padding:10px}
  .char img{height:104px;flex-shrink:0}
  .char .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
  .char .perk{font-size:13px}
  .mode{padding:10px}
  .hud{gap:10px;padding:8px 10px}
  .hud .who{width:100%}
  .stats{width:100%;margin-left:0;justify-content:space-between;gap:6px}
  .stat .v{font-size:15px}
  .hearts svg{width:20px}
  .stage{padding:12px;gap:14px;min-height:0}
  .seq{gap:6px;padding:8px}
  .tile{width:46px;height:46px;font-size:17px}
  .tile svg{width:32px;height:32px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts{gap:8px}
  .opt{height:clamp(60px,18vw,76px)}
  .gridwrap{max-width:100%;overflow-x:auto;justify-content:flex-start;-webkit-overflow-scrolling:touch}
  .grid{flex:0 0 auto;margin-inline:auto}
  .footer .bubble{flex-basis:100%}
  .footer .row{width:100%;justify-content:flex-end}
  .hud .who img{height:44px}
  .runner{height:72px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .runner{display:none}
}
</style>

<div class="wrap">
  <header class="frame logo">
    <div class="tri" aria-hidden="true"></div>
    <h1>Arma el Patrón</h1>
    <p>Secuencias, memoria y simetría.<br>Escoge personaje y aguanta lo más que puedas.</p>
  </header>

  <!-- PANTALLA 1: personaje + modo -->
  <section id="scrSelect" class="frame section">
    <div class="label">1 · Escoge personaje</div>
    <div class="chars" id="chars"></div>
    <div class="label">2 · Escoge modo</div>
    <div class="modes" id="modes"></div>
    <div class="row end">
      <p class="how" id="selSummary"></p>
      <button class="btn primary" id="btnStart">Jugar</button>
    </div>
  </section>

  <!-- PANTALLA 2: juego -->
  <section id="scrPlay" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="frame hud">
        <div class="who"><img id="hudImg" alt=""><div><b id="hudName"></b><span id="hudMode"></span></div></div>
        <div class="stats">
          <div class="stat"><span class="label">Vidas</span><div class="hearts" id="hearts"></div></div>
          <div class="stat"><span class="label">Nivel</span><span class="v" id="hudLevel">1</span></div>
          <div class="stat"><span class="label">Puntos</span><span class="v" id="hudScore">0</span></div>
          <div class="stat"><span class="label">Racha</span><span class="v" id="hudStreak">0</span></div>
        </div>
      </div>
      <div class="frame stage" id="stage">
        <div class="flash" id="flash"></div>
        <div class="prompt"><h2 id="promptTitle"></h2><span class="toast" id="toast"></span></div>
        <div id="board" style="display:flex;flex-direction:column;gap:18px"></div>
        <div class="footer">
          <div class="bubble" id="bubble"></div>
          <div class="row">
            <button class="btn" id="btnHint">Pista (0)</button>
            <button class="btn ghost" id="btnQuit">Salir</button>
          </div>
        </div>
        <img class="runner" id="runner" alt="">
      </div>
    </div>
  </section>

  <!-- PANTALLA 3: fin -->
  <section id="scrOver" class="frame over" hidden>
    <img id="overImg" alt="">
    <h2 id="overTitle">Fin de la partida</h2>
    <div class="big" id="overScore">0</div>
    <p id="overText"></p>
    <div class="row" style="justify-content:center">
      <button class="btn primary" id="btnAgain">Otra vez</button>
      <button class="btn" id="btnBack">Cambiar personaje</button>
    </div>
  </section>
</div>

const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]} return a; };

/* ---------- piezas ---------- */
const COLORS = [
  {k:'rojo',v:'#E5534B'},{k:'azul',v:'#4C8DF6'},{k:'verde',v:'#4FBF6A'},{k:'amarillo',v:'#F2C14E'},{k:'morado',v:'#A66DE0'}
];
const SHAPES = ['circulo','cuadro','triangulo','estrella','rombo'];
function shapeSVG(shape,color){
  const s='stroke="#0b0e1a" stroke-width="3" stroke-linejoin="round"';
  let g='';
  if(shape==='circulo') g=`<circle cx="20" cy="20" r="15" fill="${color}" ${s}/>`;
  if(shape==='cuadro') g=`<rect x="6" y="6" width="28" height="28" rx="3" fill="${color}" ${s}/>`;
  if(shape==='triangulo') g=`<polygon points="20,4 36,34 4,34" fill="${color}" ${s}/>`;
  if(shape==='rombo') g=`<polygon points="20,3 36,20 20,37 4,20" fill="${color}" ${s}/>`;
  if(shape==='estrella') g=`<polygon points="20,3 24.7,14.5 37,15 27.5,23 30.5,35.5 20,28.5 9.5,35.5 12.5,23 3,15 15.3,14.5" fill="${color}" ${s}/>`;
  return `<svg viewBox="0 0 40 40" aria-hidden="true">${g}</svg>`;
}
function render(it){
  if(it.t==='shape') return shapeSVG(it.s, COLORS[it.c].v);
  if(it.t==='num') return String(it.n);
  if(it.t==='arrow') return `<svg viewBox="0 0 40 40" aria-hidden="true"><g transform="rotate(${it.d} 20 20)"><polygon points="20,4 33,19 25,19 25,36 15,36 15,19 7,19" fill="#F2E8D5" stroke="#0b0e1a" stroke-width="3" stroke-linejoin="round"/></g></svg>`;
  if(it.t==='dots'){
    let c=''; for(let i=0;i<it.n;i++){ const x=7+(i%4)*8.7, y=7+Math.floor(i/4)*8.7; c+=`<circle cx="${x}" cy="${y}" r="3.4" fill="#F2C14E"/>`; }
    return `<svg viewBox="0 0 40 40" aria-hidden="true">${c}</svg>`;
  }
}
function label(it){
  if(it.t==='shape') return `${it.s} ${COLORS[it.c].k}`;
  if(it.t==='num') return `número ${it.n}`;
  if(it.t==='arrow') return `flecha a ${((it.d%360)+360)%360} grados`;
  if(it.t==='dots') return `${it.n} puntos`;
}
const key = it => it.t+':'+(it.t==='shape'?it.s+it.c:it.t==='arrow'?((it.d%360)+360)%360:it.n);

/* ---------- generadores de secuencias ---------- */
function genRepeat(L){
  const pats = L<3 ? ['AB','ABC','AAB'] : ['AB','ABC','AAB','ABB','ABCD','AABB','ABAC'];
  const pat = pick(pats);
  const letters=[...new Set(pat)];
  const used=new Set(); const tok={};
  letters.forEach(l=>{ let t; do{ t={t:'shape',s:pick(SHAPES),c:rnd(5)} }while(used.has(key(t))); used.add(key(t)); tok[l]=t; });
  const len = Math.max(6, Math.min(9, pat.length*2+1));
  const items=[]; for(let i=0;i<=len;i++) items.push(tok[pat[i%pat.length]]);
  const ans=items.pop();
  const pool=Object.values(tok).filter(t=>key(t)!==key(ans));
  return {items, ans, pool, rule:`Se repite el bloque ${pat}`};
}
function genDual(L){
  const a = 2+rnd(2), b = a===2?3:2;
  const sh=shuffle(SHAPES).slice(0,a), co=shuffle([0,1,2,3,4]).slice(0,b);
  const len=7; const items=[];
  for(let i=0;i<=len;i++) items.push({t:'shape',s:sh[i%a],c:co[i%b]});
  const ans=items.pop();
  const pool=[{t:'shape',s:ans.s,c:pick(co.filter(x=>x!==ans.c))},{t:'shape',s:pick(sh.filter(x=>x!==ans.s)),c:ans.c},{t:'shape',s:pick(sh.filter(x=>x!==ans.s)),c:pick(co.filter(x=>x!==ans.c))}];
  return {items, ans, pool, rule:`La forma se repite cada ${a} y el color cada ${b}`};
}
function genDots(L){
  const step = L<5?1:pick([1,2]); const st=1+rnd(2);
  const items=[]; for(let i=0;i<6;i++) items.push({t:'dots',n:st+i*step});
  if(items[5].n>12){ return genDots(1); }
  const ans=items.pop();
  const pool=[ans.n-1,ans.n+1,ans.n+step+1,ans.n-step-1].filter(n=>n>0&&n<=12&&n!==ans.n).map(n=>({t:'dots',n}));
  return {items, ans, pool, rule:`Cada vez hay ${step} punto${step>1?'s':''} más`};
}
function genArrow(L){
  const step = pick(L<6?[90,-90,45]:[45,-45,90,135]); const st=pick([0,45,90,180,270]);
  const items=[]; for(let i=0;i<7;i++) items.push({t:'arrow',d:st+i*step});
  const ans=items.pop();
  const pool=[ans.d+90,ans.d+180,ans.d-45,ans.d+45,ans.d-90].map(d=>({t:'arrow',d}));
  return {items, ans, pool, rule:`La flecha gira ${Math.abs(step)}° ${step>0?'a la derecha':'a la izquierda'}`};
}
function genNum(L){
  const kinds = L<6 ? ['arit'] : L<8 ? ['arit','doble','alterna'] : ['arit','doble','alterna','cuad','fibo','resta'];
  const k=pick(kinds); let seq=[], rule='';
  if(k==='arit'){ const s=1+rnd(9), d=2+rnd(L<6?4:8); for(let i=0;i<6;i++) seq.push(s+i*d); rule=`Suma ${d} cada vez`; }
  if(k==='resta'){ const d=3+rnd(6), s=d*6+rnd(10); for(let i=0;i<6;i++) seq.push(s-i*d); rule=`Resta ${d} cada vez`; }
  if(k==='doble'){ const s=1+rnd(3); for(let i=0;i<6;i++) seq.push(s*2**i); rule='Cada número es el doble del anterior'; }
  if(k==='alterna'){ const a=1+rnd(4), b=a+2+rnd(4); let v=1+rnd(5); for(let i=0;i<7;i++){ seq.push(v); v+= i%2?b:a; } rule=`Suma ${a}, luego ${b}, y se repite`; }
  if(k==='cuad'){ const s=1+rnd(3); for(let i=0;i<6;i++) seq.push((s+i)**2); rule='Son cuadrados: 1×1, 2×2, 3×3…'; }
  if(k==='fibo'){ let a=1+rnd(2), b=a+1+rnd(2); seq=[a,b]; while(seq.length<7) seq.push(seq.at(-1)+seq.at(-2)); rule='Cada número es la suma de los dos anteriores'; }
  const items=seq.map(n=>({t:'num',n})); const ans=items.pop();
  const d=Math.max(1, Math.abs(seq.at(-2)-seq.at(-3)));
  const pool=[ans.n+1,ans.n-1,ans.n+d,ans.n-d,ans.n+2,ans.n*2].filter(n=>n>0&&n!==ans.n).map(n=>({t:'num',n}));
  return {items, ans, pool, rule};
}
function genSequence(L){
  const gens=[genRepeat];
  if(L>=2) gens.push(genDots);
  if(L>=3) gens.push(genDual, genRepeat);
  if(L>=4) gens.push(genArrow, genNum);
  if(L>=6) gens.push(genNum, genDual);
  const q=pick(gens)(L);
  const seen=new Set([key(q.ans)]); const opts=[q.ans];
  for(const p of shuffle(q.pool)){ if(opts.length>=4) break; if(!seen.has(key(p))){ seen.add(key(p)); opts.push(p);} }
  let guard=0;
  while(opts.length<4 && guard++<200){
    let p = q.ans.t==='shape' ? {t:'shape',s:pick(SHAPES),c:rnd(5)} : q.ans.t==='num' ? {t:'num',n:Math.max(1,q.ans.n+rnd(9)-4)} : q.ans.t==='dots' ? {t:'dots',n:1+rnd(12)} : {t:'arrow',d:rnd(8)*45};
    if(!seen.has(key(p))){ seen.add(key(p)); opts.push(p); }
  }
  q.opts=shuffle(opts);
  return q;
}

/* ---------- estado ---------- */
const S = { char:CHARS[0], mode:MODES[0], lives:3, hints:0, score:0, level:1, streak:0, round:0, busy:false, cur:null, timers:[] };
function clearTimers(){ S.timers.forEach(t=>{clearTimeout(t);clearInterval(t)}); S.timers=[]; }

/* ---------- pantalla de selección ---------- */
function drawSelect(){
  const best=store.get();
  $('chars').innerHTML = CHARS.map(c=>`
    <button class="char" data-id="${c.id}" aria-pressed="${c.id===S.char.id}">
      <img src="${SPR[c.id+'_main']}" alt="${c.name}">
      <div class="txt">
        <h3>${c.name}</h3>
        <div class="sub">${c.sub}</div>
        <div class="perk"><b>${c.perkTitle}:</b> ${c.perk}</div>
        <div class="best">Récord: ${best[c.id]||0}</div>
      </div>
    </button>`).join('');
  const icons={
    seq:shapeSVG('circulo','#E5534B')+shapeSVG('cuadro','#4C8DF6')+shapeSVG('circulo','#E5534B')+'<span style="font-family:var(--display);color:var(--gold)">?</span>',
    mem:'<svg viewBox="0 0 40 40" width="34" height="34"><g fill="#39415f"><rect x="2" y="2" width="10" height="10"/><rect x="15" y="2" width="10" height="10"/><rect x="28" y="2" width="10" height="10"/><rect x="2" y="15" width="10" height="10"/><rect x="28" y="15" width="10" height="10"/><rect x="2" y="28" width="10" height="10"/><rect x="15" y="28" width="10" height="10"/></g><g fill="#F2C14E"><rect x="15" y="15" width="10" height="10"/><rect x="28" y="28" width="10" height="10"/><rect x="2" y="2" width="10" height="10"/></g></svg>',
    mir:'<svg viewBox="0 0 40 40" width="34" height="34"><g fill="#4C8DF6"><rect x="2" y="4" width="8" height="8"/><rect x="10" y="14" width="8" height="8"/><rect x="2" y="26" width="8" height="8"/><rect x="30" y="4" width="8" height="8"/><rect x="22" y="14" width="8" height="8"/><rect x="30" y="26" width="8" height="8"/></g><rect x="19" y="0" width="2" height="40" fill="#F2C14E"/></svg>',
    mix:'<span style="font-family:var(--display);font-size:22px;color:var(--gold)">?!</span>'
  };
  $('modes').innerHTML = MODES.map(m=>`
    <button class="mode" data-id="${m.id}" aria-pressed="${m.id===S.mode.id}">
      <div class="ico" style="height:34px">${icons[m.id].replace(/<svg viewBox="0 0 40 40" aria-hidden="true">/g,'<svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true">')}</div>
      <h3>${m.name}</h3><p>${m.desc}</p>
    </button>`).join('');
  $('selSummary').textContent = `${S.char.name} · ${S.mode.name}`;
}
$('chars').addEventListener('click',e=>{ const b=e.target.closest('.char'); if(!b) return; S.char=CHARS.find(c=>c.id===b.dataset.id); drawSelect(); });
$('modes').addEventListener('click',e=>{ const b=e.target.closest('.mode'); if(!b) return; S.mode=MODES.find(m=>m.id===b.dataset.id); drawSelect(); });

function show(id){ ['scrSelect','scrPlay','scrOver'].forEach(s=>$(s).hidden = s!==id); window.scrollTo({top:0}); }

/* ---------- partida ---------- */
function startGame(){
  clearTimers();
  Object.assign(S,{lives:S.char.lives, hints:S.char.hints, score:0, level:1, streak:0, round:0, wins:0, busy:false});
  $('hudImg').src=SPR[S.char.id+'_main']; $('hudName').textContent=S.char.name; $('hudMode').textContent=`Modo ${S.mode.name}`;
  $('runner').src=SPR[S.char.id+'_run'];
  say(S.char.start);
  show('scrPlay'); nextRound();
}
function hud(){
  const heart=(on)=>`<svg viewBox="0 0 11 10" shape-rendering="crispEdges" aria-hidden="true"><path fill="${on?'#EF6461':'#2b3150'}" d="M1 1h3v1h1v1h1V2h1V1h3v1h1v3h-1v1H9v1H8v1H7v1H4V8H3V7H2V6H1V5H0V2h1z"/></svg>`;
  $('hearts').innerHTML = Array.from({length:S.char.lives},(_,i)=>heart(i<S.lives)).join('');
  $('hearts').setAttribute('aria-label',`${S.lives} vidas`);
  $('hudLevel').textContent=S.level; $('hudScore').textContent=S.score; $('hudStreak').textContent=S.streak;
  $('btnHint').textContent=`Pista (${S.hints})`; $('btnHint').disabled = S.hints<=0 || S.busy;
}
function say(t){ $('bubble').textContent=t; }
function toast(t,cls){ const el=$('toast'); el.textContent=t; el.className='toast '+(cls||''); }
function flash(cls){ const f=$('flash'); f.className='flash'; void f.offsetWidth; f.className='flash '+cls; }

function nextRound(){
  clearTimers(); S.busy=false; S.round++;
  S.level = 1 + Math.floor((S.round-1)/3);
  toast('');
  let m=S.mode.id; if(m==='mix') m=['seq','mem','mir'][(S.round-1)%3];
  S.kind=m;
  ({seq:roundSeq, mem:roundMem, mir:roundMir})[m]();
  hud();
  if(S.char.id==='fiji'){
    const instructions={
      seq:'Observa qué cambia o se repite y elige qué pieza sigue.',
      mem:'Memoriza las casillas encendidas; después selecciónalas y pulsa Comprobar.',
      mir:'Copia en el lado derecho el reflejo del dibujo y pulsa Comprobar.'
    };
    say(S.round===1?`${S.char.start} ${instructions[m]}`:instructions[m]);
  }
}

function win(extra){
  S.busy=true; S.streak++; S.wins++;
  const pts = 10*S.level + (S.streak>=3? 5*Math.min(S.streak,10):0) + (extra||0);
  S.score+=pts; hud();
  toast(`+${pts}`,'good'); flash('good'); say(pick(S.char.ok));
  const r=$('runner'); r.classList.remove('go'); void r.offsetWidth; r.classList.add('go');
  S.timers.push(setTimeout(nextRound, 1300));
}
function lose(msg){
  S.busy=true; S.streak=0; S.lives--; hud();
  toast('−1 vida','bad'); flash('bad'); say(pick(S.char.bad)+(msg?' '+msg:''));
  S.timers.push(setTimeout(()=> S.lives<=0 ? gameOver() : nextRound(), 2600));
}

/* --- Secuencias --- */
function roundSeq(){
  const q=genSequence(S.level); S.cur=q;
  $('promptTitle').textContent='¿Qué pieza sigue?';
  $('board').innerHTML = `
    <div class="seq" role="list" aria-label="Secuencia">${q.items.map(it=>`<div class="tile" role="listitem" aria-label="${label(it)}">${render(it)}</div>`).join('')}<div class="tile q" id="qTile" role="listitem" aria-label="pieza faltante">?</div></div>
    <div class="opts" id="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}" aria-label="${label(o)}">${render(o)}</button>`).join('')}</div>`;
  $('opts').addEventListener('click',e=>{
    const b=e.target.closest('.opt'); if(!b||S.busy) return;
    const o=q.opts[+b.dataset.i]; const ok=key(o)===key(q.ans);
    document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    const qt=$('qTile'); qt.innerHTML=render(q.ans); qt.classList.add('done');
    const right=[...document.querySelectorAll('.opt')].find(x=>key(q.opts[+x.dataset.i])===key(q.ans));
    right.classList.add('right');
    if(ok) win(); else { b.classList.add('wrong'); lose(`Regla: ${q.rule.toLowerCase()}.`); }
  });
}

/* --- Memoria --- */
function roundMem(){
  const n = Math.min(5, 3+Math.floor((S.level-1)/2));
  const count = Math.min(n*n-2, 3+S.level);
  const cells = shuffle([...Array(n*n).keys()]).slice(0,count);
  const showMs = Math.round((900 + count*330) * S.char.mem);
  S.cur={n, target:new Set(cells), picked:new Set(), phase:'show'};
  $('promptTitle').textContent=`Memoriza ${count} casillas`;
  const cs = n>=5? 'min(52px,13vw)' : 'min(62px,17vw)';
  $('board').innerHTML = `
    <div class="timer"><i id="bar"></i></div>
    <div class="gridwrap"><div class="grid" id="mgrid" style="grid-template-columns:repeat(${n},auto);--cs:${cs}">
      ${Array.from({length:n*n},(_,i)=>`<button class="cell${S.cur.target.has(i)?' on':''}" data-i="${i}" aria-label="Casilla ${Math.floor(i/n)+1}, ${i%n+1}" disabled></button>`).join('')}
    </div></div>
    <div class="row" style="justify-content:center"><button class="btn primary" id="btnCheck" disabled>Comprobar</button></div>`;
  const bar=$('bar'); bar.style.transition=`width ${showMs}ms linear`; requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.width='0%'));
  S.timers.push(setTimeout(()=>{
    S.cur.phase='play';
    $('promptTitle').textContent=`Tu turno: marca las ${count} casillas`;
    document.querySelectorAll('#mgrid .cell').forEach(c=>{c.classList.remove('on'); c.disabled=false;});
    $('btnCheck').disabled=false; hud();
  }, showMs));
  $('mgrid').addEventListener('click',e=>{
    const c=e.target.closest('.cell'); if(!c||S.busy||S.cur.phase!=='play') return;
    const i=+c.dataset.i; if(S.cur.picked.has(i)){S.cur.picked.delete(i);c.classList.remove('on')} else {S.cur.picked.add(i);c.classList.add('on')}
    c.setAttribute('aria-pressed',S.cur.picked.has(i));
  });
  $('btnCheck').addEventListener('click',()=>checkGrid('mgrid'));
}

/* --- Espejo --- */
function roundMir(){
  const rows = Math.min(6, 4+Math.floor((S.level-1)/3));
  const half = Math.min(4, 2+Math.floor((S.level-1)/2));
  const cols = half*2;
  const density = 0.35 + Math.min(0.2, S.level*0.02);
  const color = COLORS[(S.round)%5].v;
  const left=new Set(), target=new Set();
  for(let r=0;r<rows;r++) for(let c=0;c<half;c++){
    if(Math.random()<density){ left.add(r*cols+c); target.add(r*cols+(cols-1-c)); }
  }
  if(target.size<2){ return roundMir(); }
  S.cur={rows, cols, half, target, picked:new Set(), phase:'play', left};
  $('promptTitle').textContent='Refleja el dibujo en el lado derecho';
  const cs = cols>=8? 'min(44px,9.5vw)' : 'min(54px,12vw)';
  $('board').innerHTML = `
    <div class="gridwrap"><div class="grid" id="mgrid" style="grid-template-columns:repeat(${cols},auto);--cs:${cs};--c:${color}">
      ${Array.from({length:rows*cols},(_,i)=>{ const c=i%cols, isL=c<half;
        return isL ? `<button class="cell lock${left.has(i)?' on':''}" disabled aria-label="Modelo fila ${Math.floor(i/cols)+1} columna ${c+1}${left.has(i)?' encendida':''}"></button>`
                   : `<button class="cell" data-i="${i}" aria-label="Fila ${Math.floor(i/cols)+1}, columna ${c+1}"></button>`;}).join('')}
      <div class="axis" aria-hidden="true"></div>
    </div></div>
    <div class="row" style="justify-content:center"><button class="btn primary" id="btnCheck">Comprobar</button></div>`;
  $('mgrid').addEventListener('click',e=>{
    const c=e.target.closest('.cell:not(.lock)'); if(!c||S.busy) return;
    const i=+c.dataset.i; if(S.cur.picked.has(i)){S.cur.picked.delete(i);c.classList.remove('on')} else {S.cur.picked.add(i);c.classList.add('on')}
    c.setAttribute('aria-pressed',S.cur.picked.has(i));
  });
  $('btnCheck').addEventListener('click',()=>checkGrid('mgrid'));
}

function checkGrid(gid){
  if(S.busy) return;
  const {target,picked}=S.cur;
  const missed=[...target].filter(i=>!picked.has(i)), extra=[...picked].filter(i=>!target.has(i));
  $('btnCheck').disabled=true;
  document.querySelectorAll(`#${gid} .cell:not(.lock)`).forEach(c=>c.disabled=true);
  if(!missed.length && !extra.length){ win(S.kind==='mem'?target.size:0); return; }
  missed.forEach(i=>{ const c=document.querySelector(`#${gid} .cell[data-i="${i}"]`); c.classList.add('miss'); });
  extra.forEach(i=>{ const c=document.querySelector(`#${gid} .cell[data-i="${i}"]`); c.classList.add('extra'); });
  lose(`Te faltaron ${missed.length} y sobraron ${extra.length}.`);
}

/* --- Pistas --- */
$('btnHint').addEventListener('click',()=>{
  if(S.busy||S.hints<=0) return;
  if(S.kind==='seq'){
    const wrong=[...document.querySelectorAll('.opt:not(.gone)')].filter(b=>key(S.cur.opts[+b.dataset.i])!==key(S.cur.ans));
    if(wrong.length<=1){ say('Ya quedan pocas opciones, tú puedes.'); return; }
    shuffle(wrong).slice(0,2).forEach(b=>{b.classList.add('gone'); b.disabled=true;});
    S.hints--; say(`Pista: ${S.cur.rule.toLowerCase()}.`);
  } else {
    if(S.cur.phase!=='play') { say('Espera a que sea tu turno.'); return; }
    const missing=[...S.cur.target].filter(i=>!S.cur.picked.has(i));
    const extra=[...S.cur.picked].filter(i=>!S.cur.target.has(i));
    if(extra.length){ const i=extra[0]; S.cur.picked.delete(i); const c=document.querySelector(`#mgrid .cell[data-i="${i}"]`); c.classList.remove('on'); c.classList.add('hint'); say('Quité una casilla que estaba mal.'); }
    else if(missing.length){ const i=pick(missing); S.cur.picked.add(i); const c=document.querySelector(`#mgrid .cell[data-i="${i}"]`); c.classList.add('on','hint'); say('Te marqué una casilla correcta.'); }
    else { say('Ya está completo, dale a Comprobar.'); return; }
    S.hints--;
  }
  hud();
});

function gameOver(){
  clearTimers();
  const best=store.get(); const prev=best[S.char.id]||0; const rec=S.score>prev;
  if(rec){ best[S.char.id]=S.score; store.set(best); }
  $('overImg').src=SPR[S.char.id+'_main'];
  $('overTitle').textContent = rec && S.score>0 ? '¡Nuevo récord!' : 'Fin de la partida';
  $('overScore').textContent=S.score;
  $('overText').textContent=`${S.char.name} llegó al nivel ${S.level} en modo ${S.mode.name}, con ${S.wins} reto${S.wins===1?'':'s'} resuelto${S.wins===1?'':'s'}. ${rec? '' : 'Récord de '+S.char.name+': '+prev+'.'}`;
  show('scrOver');
}

$('btnStart').addEventListener('click',startGame);
$('btnQuit').addEventListener('click',()=>{ clearTimers(); drawSelect(); show('scrSelect'); });
$('btnAgain').addEventListener('click',startGame);
$('btnBack').addEventListener('click',()=>{ drawSelect(); show('scrSelect'); });

drawSelect();
</script>
